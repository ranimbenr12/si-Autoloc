
spring.application.name=autoloc

# Connexion à la base autoloc
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root

server.port=8081
# Création/mise à jour automatique des tables à partir des @Entity
spring.jpa.hibernate.ddl-auto=update

# Afficher le SQL (CREATE TABLE, etc.) dans la console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true